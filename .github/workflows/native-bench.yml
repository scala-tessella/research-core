name: Native benchmark

# Manually triggered: the BackTrackerCESpec maxSize-18 benchmark ladder on one runner, so JVM and Scala
# Native numbers are comparable. CI with LLVM 18 is the reference bench environment (macOS local runs
# add clang-14 noise: thin LTO unstable there, per Scala Native's own warning).
#
# Known expectations (evidence so far):
#   - debug is correct everywhere; EVERY LLVM-optimized build faults — release-fast crashes (SIGSEGV),
#     release-fast with Interflow off (Optimizing skipped) STILL crashes, thin LTO builds then HANGS —
#     across clang 14/macOS and clang 18/Linux. Optimizer and toolchain acquitted: the suspect is the
#     interaction of LLVM optimization with Scala Native 0.5.12's multithreading runtime (Immix GC
#     safepoints / memory ordering). The boehm-GC variant is the discriminating probe. All release
#     steps are continue-on-error WITH per-step timeouts: a crash or hang is itself a result;
#   - the ForkJoin engine may STACK-OVERFLOW under release modes (join-helping recursion, deep native
#     stacks);
#   - RESEARCH_BENCH_ENGINE=ce makes the spec benchmark the CE engine alone against pinned counts.

on:
  workflow_dispatch:
  # workflow_dispatch is only registered by GitHub once this file reaches the default branch — until the
  # branch merges, a push that touches THIS file is the trigger (fires once, then stays quiet)
  push:
    paths:
      - ".github/workflows/native-bench.yml"

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLVM_BIN: /usr/lib/llvm-18/bin
      # release-full codegen (Lower/ControlFlow) blew the default 1 GB sbt heap
      SBT_OPTS: -Xmx4g
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Install clang 18 and libgc (Boehm GC headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libgc-dev
          "$LLVM_BIN/clang" --version

      - name: JVM baseline (both engines)
        run: |
          set -o pipefail
          sbt 'coreJVM/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native debug (both engines)
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native release-fast (CE engine only)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALANATIVE_MODE: release-fast
          RESEARCH_BENCH_ENGINE: ce
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      # the discriminating probe: same optimized build, conservative Boehm GC instead of Immix — a clean
      # run points the fault at the Immix safepoint/optimization interaction
      - name: Native release-fast + Boehm GC (CE engine only)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_GC: boehm
          RESEARCH_BENCH_ENGINE: ce
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native release-fast, Interflow off (CE engine only)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_OPTIMIZE: "false"
          RESEARCH_BENCH_ENGINE: ce
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native release-full (CE engine only)
        continue-on-error: true
        timeout-minutes: 20
        env:
          SCALANATIVE_MODE: release-full
          RESEARCH_BENCH_ENGINE: ce
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native release-fast + thin LTO (CE engine only)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALANATIVE_MODE: release-fast
          SCALANATIVE_LTO: thin
          RESEARCH_BENCH_ENGINE: ce
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Native release-fast (both engines — ForkJoin may stack-overflow)
        continue-on-error: true
        timeout-minutes: 15
        env:
          SCALANATIVE_MODE: release-fast
        run: |
          set -o pipefail
          sbt 'coreNative/testOnly *BackTrackerCESpec' | tee -a bench.log

      - name: Collect timings
        if: always()
        run: |
          {
            echo '## BackTrackerCESpec maxSize-18 timings'
            echo '```'
            grep -E '(ForkJoin|CE) engine' bench.log || echo 'no timing lines captured'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
