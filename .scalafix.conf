rules = [
#  OrganizeImports,
  DisableSyntax,
  LeakingImplicitClassVal
]

DisableSyntax {
  keywords = [
#     var,
    null,
#    return
  ]
  noAsInstanceOf = true
  noIsInstanceOf = true
  # unlike dcel, noWhile stays OFF here: the enumeration engines are deliberately imperative
  # (150+ hot-loop whiles across DelaneySymbols, Sigma0Assembly, MetricLayer, Sha256, ...)
  noWhile = false
  noXml = true
}

OrganizeImports {
  groupedImports = Merge
  groupExplicitlyImportedImplicits = true
  removeUnused = true
  expandRelative = true
}
